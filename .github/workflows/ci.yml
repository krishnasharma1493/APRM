# CI baseline (K-06). Runs on every push and pull request, on every branch.
#
# Versions were looked up on the official pages on 2026-11-01 (see the K-06 PR):
#  - actions/checkout      v7  (latest release v7.0.1; README recommends @v7)
#  - actions/setup-python  v7  (latest release v7.1.0; README recommends @v7)
#  - runner image          ubuntu-24.04 (what GitHub's runner-images README lists for ubuntu-latest)
#  - Python 3.13           the line recorded in docs/TOOLCHAIN.md; setup-python picks the newest 3.13.x patch (K-18 freeze).
#  - pip packages          installed from requirements.lock.txt (K-18 freeze).
#  - emsdk                 pinned exactly in the build-wasm job (env EMSDK_VERSION), same as docs/TOOLCHAIN.md.
# No secrets are used.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Print tool versions (recorded in docs/TOOLCHAIN.md)
        run: |
          cc --version | head -1
          gcc --version | head -1
          make --version | head -1
          cat /etc/os-release | head -2
      - name: Build with -Wall -Wextra -Werror
        run: make

  test-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the C tests
        run: make test

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # LeakSanitizer is available on Linux, so also report leaks.
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test under ASan + UBSan
        run: make sanitize
      - name: Hardening checks (fuzz, allocation-failure injection, stress, grep-unsafe)
        run: make hardening

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the console program (the K-15 tests run build/aprm)
        run: make
      - name: Create venv and install from the lock file
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt
          .venv/bin/python --version
          .venv/bin/python -m pip --version
      - name: Run Python tests
        run: |
          # pytest exit code 5 means "no tests collected": treated as a pass until tests exist.
          set +e
          .venv/bin/python -m pytest tests/py -v -rs
          code=$?
          if [ "$code" -eq 5 ]; then echo "no tests collected (exit 5): treated as pass"; exit 0; fi
          exit "$code"

  build-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned emsdk
        env:
          # Exact version, kept equal to the Emscripten row of docs/TOOLCHAIN.md (change both together).
          EMSDK_VERSION: "6.0.13"
        run: |
          echo "emsdk version: $EMSDK_VERSION"
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
      - name: Print Node version (recorded in docs/TOOLCHAIN.md)
        run: |
          . "$HOME/emsdk/emsdk_env.sh"
          node --version
      - name: Build web/vendor/aprm.js
        run: |
          . "$HOME/emsdk/emsdk_env.sh"
          emcc --version | head -1
          make wasm
      - name: API tests and golden cases through Node
        run: |
          . "$HOME/emsdk/emsdk_env.sh"
          node --version
          node wasm/test_api.mjs
      - name: Every golden case of the built policies through Node equals its expected file
        run: |
          . "$HOME/emsdk/emsdk_env.sh"
          # knapsack (K-34) is not built yet: its cases are not run.
          for exp in tests/cases/*.expected.csv; do
            base=$(basename "$exp" .expected.csv)
            name=${base%%.*}
            policy=${base#*.}
            case "$policy" in fcfs|priority|sjf|aging|reserve) ;; *) continue ;; esac
            args=""
            if [ -f "tests/cases/$name.args" ]; then args=$(cat "tests/cases/$name.args"); fi
            # shellcheck disable=SC2086
            node wasm/run_wasm.mjs --policy "$policy" --in "tests/cases/$name.csv" $args > "$RUNNER_TEMP/w.csv"
            diff "$RUNNER_TEMP/w.csv" "$exp"
            echo "ok $name $policy"
          done
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Conformance, console program versus the fresh WebAssembly build (K-21)
        env:
          # The check must really run here: a skip (no node, no build) fails the test.
          CONFORMANCE_REQUIRED: "1"
        run: |
          . "$HOME/emsdk/emsdk_env.sh"
          make
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt
          .venv/bin/python -m pytest tests/py/test_conformance.py -v -rs
          # 200 seeds x 5 policies = 1,000 byte-for-byte comparisons
          .venv/bin/python tools/conformance.py --runs 200
      - name: api.c natively under ASan and UBSan (no Node)
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -g -fsanitize=address,undefined -Icore \
            core/*.c wasm/api.c wasm/native_check.c -o build/native_check -lm
          ASAN_OPTIONS=detect_leaks=1 build/native_check

  # deploy (K-37): publishes web/ to GitHub Pages. Main pushes only, and only once Krishna has
  # enabled Pages (Settings > Pages > Source: GitHub Actions) and set the repository variable
  # PAGES_ENABLED=true. Until then the job is skipped, so main stays green. aprm.js is rebuilt here
  # (never committed). Action versions looked up on 2026-11-01 (K-37 PR):
  #  - actions/configure-pages       v6  (latest release v6.0.0)
  #  - actions/upload-pages-artifact v5  (latest release v5.0.0)
  #  - actions/deploy-pages          v5  (latest release v5.0.1; README: pages: write + id-token: write)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: [build-c, test-c, sanitize, python, build-wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned emsdk
        env:
          # Exact version, kept equal to the build-wasm job and docs/TOOLCHAIN.md (change all together).
          EMSDK_VERSION: "6.0.13"
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
      - name: Build web/vendor/aprm.js (never committed)
        run: |
          . "$HOME/emsdk/emsdk_env.sh"
          make wasm
          test -s web/vendor/aprm.js
          rm -f web/vendor/.gitkeep
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
